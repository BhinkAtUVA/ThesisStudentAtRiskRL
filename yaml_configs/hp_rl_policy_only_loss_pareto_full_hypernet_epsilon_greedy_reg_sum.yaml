method: bayes
metric:
  goal: minimize
  name: eval/avg_mil_loss
parameters:
  hdim:
    distribution: constant
    value: 8
  epochs:
    distribution: constant
    value: 200
  learning_rate:
    distribution: constant
    value: 1.0e-03
  epsilon:
    distribution: uniform
    max: 1.0
    min: 0.0
  reg_coef:
    distribution: uniform
    max: 1.0
    min: 0.0
  early_stopping_patience:
    distribution: constant
    value: 25
  batch_size:
    distribution: constant
    value: 128
  embedding_dim:
    distribution: categorical
    values: [32, 64, 128, 256]
  fourier_scale:
    distribution: log_uniform_values
    min: 1.0
    max: 10.0
  hyper_ratio:
    distribution: log_uniform_values
    min: 0.005
    max: 0.2
run_cap: 50